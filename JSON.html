<html>
    <head>
     <title>JSON</title>
    </head>
    <body>
     <h2>This is JSON in JS</h2>
     <p id="result"></p>
     <script>
        var myObj={name:"Varman", age:10, grade:5};
        var myJSON= JSON.stringify(myObj);
        var newObj= JSON.parse(myJSON);
        document.getElementById("result").innerHTML= newObj.name;
     </script>
    </body>
</html>
